name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match tag to Cargo version
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${expected}" >&2
            exit 1
          fi

  build-linux:
    name: Build Linux x86_64 musl
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build release binary
        run: ./build.sh --target x86_64-unknown-linux-musl
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          seven_zip="$(command -v 7zz || command -v 7z || true)"
          if [[ -z "${seven_zip}" ]]; then
            echo "error: 7-Zip is not installed" >&2
            exit 1
          fi
          archive="${PWD}/dist/updater-${GITHUB_REF_NAME}-linux.7z"
          (
            cd target/x86_64-unknown-linux-musl/release
            "${seven_zip}" a -t7z -mx=9 "${archive}" updater
          )
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-musl
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build release binary
        shell: bash
        run: ./build.sh --target x86_64-pc-windows-gnu
      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $sevenZipCommand = Get-Command 7z -ErrorAction SilentlyContinue
          $sevenZip = if ($sevenZipCommand) {
            $sevenZipCommand.Source
          } else {
            Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path $sevenZip)) {
            throw '7-Zip is not installed'
          }
          $archive = Join-Path $PWD "dist/updater-${env:GITHUB_REF_NAME}-windows.7z"
          Push-Location target/x86_64-pc-windows-gnu/release
          try {
            & $sevenZip a -t7z -mx=9 $archive updater.exe
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip exited with code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-gnu
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal release binary
        run: ./build.sh --macos-universal
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          seven_zip="$(command -v 7zz || command -v 7z || true)"
          if [[ -z "${seven_zip}" ]]; then
            echo "error: 7-Zip is not installed" >&2
            exit 1
          fi
          archive="${PWD}/dist/updater-${GITHUB_REF_NAME}-macos.7z"
          (
            cd target/universal-apple-darwin/release
            "${seven_zip}" a -t7z -mx=9 "${archive}" updater
          )
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum updater-* > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
