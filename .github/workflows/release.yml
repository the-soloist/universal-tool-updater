name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Match tag to Cargo version
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${expected}" >&2
            exit 1
          fi
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  build-linux:
    name: Build Linux ${{ matrix.arch }} musl
    needs: validate-tag
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            platform: linux
            use_zig: false
          - arch: arm64
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
            use_zig: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.use_zig == false
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Install Zig
        if: matrix.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        if: matrix.use_zig
        run: cargo install cargo-zigbuild --locked
      - name: Build release binary
        run: ./build.sh --target ${{ matrix.target }}
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          seven_zip="$(command -v 7zz || command -v 7z || true)"
          if [[ -z "${seven_zip}" ]]; then
            echo "error: 7-Zip is not installed" >&2
            exit 1
          fi
          archive="${PWD}/dist/updater-${GITHUB_REF_NAME}-${{ matrix.platform }}.7z"
          (
            cd target/${{ matrix.target }}/release
            "${seven_zip}" a -t7z -mx=9 "${archive}" updater
          )
      - uses: actions/upload-artifact@v8
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    needs: validate-tag
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-gnu
            platform: windows
          - arch: arm64
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: ./build.sh --target ${{ matrix.target }}
      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $sevenZipCommand = Get-Command 7z -ErrorAction SilentlyContinue
          $sevenZip = if ($sevenZipCommand) {
            $sevenZipCommand.Source
          } else {
            Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path $sevenZip)) {
            throw '7-Zip is not installed'
          }
          $archive = Join-Path $PWD "dist/updater-${env:GITHUB_REF_NAME}-${{ matrix.platform }}.7z"
          Push-Location target/${{ matrix.target }}/release
          try {
            & $sevenZip a -t7z -mx=9 $archive updater.exe
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip exited with code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v8
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: validate-tag
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            platform: macos-arm64
          - arch: x86_64
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: ./build.sh --target ${{ matrix.target }}
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          seven_zip="$(command -v 7zz || command -v 7z || true)"
          if [[ -z "${seven_zip}" ]]; then
            echo "error: 7-Zip is not installed" >&2
            exit 1
          fi
          archive="${PWD}/dist/updater-${GITHUB_REF_NAME}-${{ matrix.platform }}.7z"
          (
            cd target/${{ matrix.target }}/release
            "${seven_zip}" a -t7z -mx=9 "${archive}" updater
          )
      - uses: actions/upload-artifact@v8
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum updater-* > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
