name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - os: windows-latest
            targets: x86_64-pc-windows-gnu
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.targets }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Runtime profiles live outside this repository; check command coverage uses
      # self-contained configurations in tests/check_command.rs.
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build release binary
        if: runner.os != 'macOS'
        shell: bash
        run: ./build.sh --target ${{ matrix.targets }}
      - name: Build universal macOS release binary
        if: runner.os == 'macOS'
        run: ./build.sh --macos-universal
