# Profile 文件示例。
#
# 使用方式：
#   1. 将本文件复制到 profiles/<profile-name>.yaml。
#   2. 在 profiles/manifest.yaml 的 include 中加入该文件名。
#   3. 修改工具 ID、下载规则和安装目录，并把 enabled 改为 true。
#
# 工具 ID 必须使用小写 kebab-case。示例工具默认禁用，避免误下载。
tools:
  # GitHub Release：匹配一个压缩资产，解压并保存为目录。
  # prerelease 默认被跳过；仅配置 token 走 API 解析时该过滤生效，
  # 无 token 的 atom 路径无法识别 prerelease。需要预发布版时
  # 设置 allow_prereleases: true。
  example-github-directory:
    name: ExampleGitHubDirectory
    enabled: false
    release:
      type: github
      repository: sharkdp/bat
      ignore_versions:
        - v0.24.0
      # allow_prereleases: true
    artifacts:
      - type: github-asset
        pattern: '^bat-v[^/]+-x86_64-pc-windows-msvc\.zip$'
        # 可选的完整性固定（pin）：64 位十六进制摘要会在安装前核对，
        # 不匹配时按下载失败处理；github-asset 的 sha256 支持 {version}
        # 占位符，github-assets / github-source 仅接受静态值。
        # sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
    install:
      destination: Examples/GitHub/Directory
      input: extract
      existing: replace
      save: directory
      strip_single_root: true
      create_destination: true
      executable:
        - bat.exe
      symlinks:
        - from: bat.exe
          to: bin/example-bat.exe

  # GitHub Release：匹配全部资产并保留原始文件。
  # input: copy 会自动把文件保存到 <destination>/release，版本写入
  # <destination>/.version；destination 不要手动添加 release。
  example-github-assets:
    name: ExampleGitHubAssets
    enabled: false
    release:
      type: github
      repository: frida/frida
    artifacts:
      - type: github-assets
        pattern: '^frida-server-.+-windows-x86_64\.xz$'
    install:
      destination: Examples/GitHub/Assets
      input: copy
      existing: replace
      save: directory

  # Web 页面：使用正则解析版本和下载链接，处理后保存为 7z。
  # 展示名含作者时推荐使用 <工具名>@<作者名>。
  example-web-archive:
    name: ExampleWebTool@example-author
    enabled: false
    release:
      type: web
      url: https://example.com/downloads/
      version_pattern: 'Latest version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
      ignore_versions:
        - 1.0.0-beta
    artifacts:
      - type: page-link
        pattern: 'href="([^"]*example-tool-windows-x64\.zip)"'
    install:
      destination: Examples/Web/Archive
      input: extract
      existing: merge
      save: archive
      strip_single_root: true
      archive_name: '{name}#{version}.7z'
    hooks:
      after_unpack:
        - type: rename
          from: example-tool-*.exe
          to: example-tool.exe

      # 必须使用外部逻辑时只允许 Python 3；启用前确保脚本真实存在。
      # environment_mode 默认 minimal：子进程只保留 PATH/SYSTEMROOT/TEMP/
      # TMP/TZ + UTU_* 保留变量 + environment 配置变量；需要完整继承时
      # 显式改为 inherit。
      # before_update:
      #   - type: python
      #     script: scripts/custom/prepare.py
      #     args: [--strict]
      #     timeout_seconds: 60
      #     working_directory: toolkit
      #     environment_mode: minimal
      #     environment:
      #       MODE: portable

  # HTTP 固定文件：使用响应头生成版本，并保留 release URL 的原始文件。
  example-http-file:
    name: ExampleHTTPFile
    enabled: false
    release:
      type: http
      url: https://example.com/releases/example-runtime-latest.zip
      version_headers:
        - etag
        - last-modified
        - content-length
    artifacts:
      - type: release-url
    install:
      destination: Examples/HTTP/File
      input: copy
      existing: replace
      save: directory

  # Manual 占位：登记无法自动更新的工具（付费授权、需登录论坛下载等）。
  # updater 永不解析版本、不下载安装；update 汇总显示 skipped
  # （managed manually; not auto-updated），list 输出带 [manual] 标注。
  # destination 仍参与目录冲突检测，防止其他工具占用该目录；
  # artifacts 必须为空列表。此类工具可以安全地保持 enabled: true。
  ida-pro:
    name: IDA Pro
    enabled: true
    release:
      type: manual
    artifacts: []
    install:
      destination: Reverse/Decompiler/IDAPro

  # URL 模板 + sha256 校验：可选的 64 位十六进制摘要会在安装前核对，
  # 不匹配时按下载失败处理并清除断点缓存；url-template 的 sha256 支持
  # {version} 占位符。所有 URL 默认必须使用 HTTPS，如需放行 HTTP 明文
  # 下载，必须在 manifest.yaml 顶层设置 allow_insecure_transports: true。
  example-url-template-sha256:
    name: ExampleUrlTemplateSha256
    enabled: false
    release:
      type: web
      url: https://example.com/downloads/
      version_pattern: 'Latest version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
    artifacts:
      - type: url-template
        url: 'https://example.com/releases/{version}/example-tool-{version}.zip'
        # 占位符外的其余字符仍必须是十六进制；版本解析后先渲染再比对。
        sha256: '000000000000000000000000000000000000000000000000000000{version}'
    install:
      destination: Examples/Web/Checksummed
      input: extract
      existing: replace
      save: directory
